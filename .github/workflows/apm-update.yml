name: apm-update
on:
  schedule:
    - cron: "0 0 * * 1"     # 毎週月曜 00:00 UTC
  workflow_dispatch: {}
concurrency:
  group: apm-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    # least-privilege: このジョブでのみ必要な権限を付与する
    permissions:
      contents: write       # 更新した pin (apm.yml) をコミットするため
      pull-requests: write  # peter-evans/create-pull-request が PR を作成するため
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1            # actions/checkout v7.0.1
        with:
          persist-credentials: false   # GITHUB_TOKEN を git config に永続化させない（トークン漏えい面の縮小）

      - name: Snapshot current manifests
        run: |
          mkdir -p "$RUNNER_TEMP/apm-before"
          cp base/apm.yml "$RUNNER_TEMP/apm-before/base.apm.yml"
          cp mcp-toolkit/apm.yml "$RUNNER_TEMP/apm-before/mcp.apm.yml"

      # apm-action(update:true) は annotated tag 前提のため、lightweight tag で
      # release する chrome-devtools-mcp で "No annotated tag found" と失敗する。
      # 4 pin（superpowers / chrome-devtools / context7 / serena）すべてを
      # tag 種別非依存の独自スクリプトで解決・更新する（lockfile は生成しない）。
      - name: Update apm dependency pins (superpowers / chrome-devtools / context7 / serena)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/apm-pins.sh update

      - name: Patch-bump changed packages
        run: |
          ./scripts/apm-pins.sh bump-version base/apm.yml "$RUNNER_TEMP/apm-before/base.apm.yml"
          ./scripts/apm-pins.sh bump-version mcp-toolkit/apm.yml "$RUNNER_TEMP/apm-before/mcp.apm.yml"

      - name: Render PR body
        run: ./scripts/apm-pins.sh render-body "$RUNNER_TEMP/apm-before" > "$RUNNER_TEMP/apm-pr-body.md"

      - name: Create or update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1   # create-pull-request v8.1.1
        with:
          branch: chore/apm-deps-update
          delete-branch: true
          sign-commits: true          # GitHub API 経由でコミットを作成し verified 署名（秘密鍵不要）
          title: "chore(deps): apm 依存 pin を更新"
          body-path: ${{ runner.temp }}/apm-pr-body.md
          labels: dependencies
          commit-message: "chore(deps): apm 依存 pin を更新"
          add-paths: |
            base/apm.yml
            mcp-toolkit/apm.yml
