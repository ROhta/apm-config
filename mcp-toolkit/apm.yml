name: apm-config-mcp-toolkit
version: 1.4.1
description: 共通開発ツール MCP（context7 / serena / chrome-devtools / deepwiki）の pin を一元管理
author: ROhta
license: GPL-3.0-or-later
type: instructions
targets:
  - claude
  - codex
  - copilot
includes: auto
dependencies:
  mcp:
    # すべて self-defined の直接定義（depth 1 で auto-trust）。版は scripts/apm-pins.sh が追従する。
    # chrome-devtools: 上流プラグインは Agent Plugins 形式で apm 0.35 が Claude / Codex に展開しないため MCP のみ定義
    - name: chrome-devtools
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "chrome-devtools-mcp@1.12.0"
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "@upstash/context7-mcp@4.5.1"
    - name: serena
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - git+https://github.com/oraios/serena@5e4f5cd173c7ff3eed37ee3f1de6c266b937c5dc
        - serena
        - start-mcp-server
    # streamable-http（SSE は codex アダプタが受理しない）
    - name: deepwiki
      registry: false
      transport: http
      url: https://mcp.deepwiki.com/mcp
