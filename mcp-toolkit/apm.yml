name: apm-config-mcp-toolkit
version: 1.3.1
description: 共通開発ツール MCP（context7 / serena / chrome-devtools / deepwiki）の pin を一元管理
author: ROhta
license: GPL-3.0-or-later
type: instructions
targets:
  - claude
  - codex
  - copilot
includes: auto
dependencies:
  apm:
    # chrome-devtools は上流リポジトリ自体がプラグイン形式。この apm: 依存は
    # chrome-devtools の SKILLS を提供する（この SHA 時点で chrome-devtools-mcp@1.5.0 を同梱）。
    # MCP サーバー本体はプラグイン経由だと consumer から見て transitive（depth 2）になり、
    # apm 0.24.1 以降は auto-trust されないため、下の mcp: で direct 宣言（depth 1）して trust する。
    - ChromeDevTools/chrome-devtools-mcp#913308263bdc8042af74924b68dc39a374ad071d
  mcp:
    # 直接定義（stdio / remote）。consumer から見て mcp-toolkit は直接依存（depth 1）
    # なので self-defined でも auto-trust され、これらには --trust-transitive-mcp 不要。
    #
    # context7 / serena は npx・uvx で MCP サーバー本体のバージョンまで pin。
    # コマンド直書きなので claude / codex / copilot いずれにも可搬。
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "@upstash/context7-mcp@3.2.2"
    - name: serena
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - git+https://github.com/oraios/serena@2449313c0d7427275c4c66aedff7d4881782f713
        - serena
        - start-mcp-server
    # deepwiki は認証不要のホスト型リモート MCP（streamable-http エンドポイント）。
    # SSE ではないため codex アダプタも受理し、claude / codex / copilot 全てに配布される。
    - name: deepwiki
      registry: false
      transport: http
      url: https://mcp.deepwiki.com/mcp
    # chrome-devtools MCP サーバー本体を direct 宣言（depth-1）。apm 0.24.1 は
    # プラグイン経由の transitive MCP を auto-trust しなくなったため、ここで直接宣言して
    # 全 consumer で trust されるようにする（skills は上の apm: プラグインが引き続き提供）。
    - name: chrome-devtools
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - chrome-devtools-mcp@1.5.0
