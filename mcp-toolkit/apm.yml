name: apm-config-mcp-toolkit
version: 1.3.2
description: 共通開発ツール MCP（context7 / serena / chrome-devtools / deepwiki）の pin を一元管理
author: ROhta
license: GPL-3.0-or-later
type: instructions
targets:
  - claude
  - codex
  - copilot
includes: auto
dependencies:
  apm:
    # chrome-devtools は上流リポジトリ自体がプラグイン形式。プラグイン manifest が
    # MCP サーバー本体を pin する（この SHA 時点で chrome-devtools-mcp@1.6.0）。
    # 注意: プラグイン経由の MCP は consumer から見て transitive（depth 2）になるため、
    #       consumer 側で `apm install --trust-transitive-mcp` が必要。
    - ChromeDevTools/chrome-devtools-mcp#f621d0052fd241dca76e7f615b20e9d320ba965f
  mcp:
    # 直接定義（stdio / remote）。consumer から見て mcp-toolkit は直接依存（depth 1）
    # なので self-defined でも auto-trust され、これらには --trust-transitive-mcp 不要。
    #
    # context7 / serena は npx・uvx で MCP サーバー本体のバージョンまで pin。
    # コマンド直書きなので claude / codex / copilot いずれにも可搬。
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "@upstash/context7-mcp@3.2.5"
    - name: serena
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - git+https://github.com/oraios/serena@bcac0969fb8685783ea6d0f2642468fcc47e6395
        - serena
        - start-mcp-server
    # deepwiki は認証不要のホスト型リモート MCP（streamable-http エンドポイント）。
    # SSE ではないため codex アダプタも受理し、claude / codex / copilot 全てに配布される。
    - name: deepwiki
      registry: false
      transport: http
      url: https://mcp.deepwiki.com/mcp
